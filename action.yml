name: "Lock Inactive Threads"
description: "A GitHub Action designed to lock issues and pull requests that have been inactive for a configurable number of days"
author: "Jacky Liang"

branding:
  icon: "lock"
  color: "orange"

inputs:
  GITHUB_TOKEN:
    description: "GitHub token used to search and lock issues and pull requests"
    required: true
    default: ""
  ISSUE_COMMENT:
    description: "Comment to add before locking an inactive issue"
    required: false
    default: "Due to inactivity, this issue will be locked and marked as resolved. If you have any further questions or inquiries, please feel free to open a new issue."
  ISSUE_INACTIVE_DAYS:
    description: "Number of days of inactivity before an issue is locked"
    required: false
    default: "30"
  ISSUE_LOCK_REASON:
    description: "Lock reason for issues (off-topic, resolved, spam, too heated)"
    required: false
    default: "resolved"
  PR_COMMENT:
    description: "Comment to add before locking an inactive pull request"
    required: false
    default: "Due to inactivity, this pull request will be locked and marked as resolved. If you have any further questions or inquiries, please feel free to open a new pull request."
  PR_INACTIVE_DAYS:
    description: "Number of days of inactivity before a pull request is locked"
    required: false
    default: "30"
  PR_LOCK_REASON:
    description: "Lock reason for pull requests (off-topic, resolved, spam, too heated)"
    required: false
    default: "resolved"
  EXCLUDE_LABELS:
    description: "Labels to exclude from locking (comma-delimited list)"
    required: false
    default: ""
  LOG_OUTPUT:
    description: "Enable detailed logging of locked issues and pull requests"
    required: false
    default: "true"
  DRY_RUN:
    description: "Run without making any changes (preview what would be locked)"
    required: false
    default: "false"

outputs:
  result:
    description: "The success or failure response after the action has completed"

runs:
  using: "node22"
  main: "action/index.js"
